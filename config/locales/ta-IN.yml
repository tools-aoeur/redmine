  twofa__totp__text_pairing_info_html: இந்த QR குறியீட்டை ஸ்கேன் செய்யவும் அல்லது எளிய உரை விசையை TOTP செயலி உள்ளிடவும்
    (எ.கா. <a href="https://support.google.com/accounts/answer/1066447">கூகுள் அங்கீகரிப்பாளர்</a>, <a
    href="https://authy.com/download/">Authy</a>, <a href="https://guide.duo.com/third-party-accounts" > இரட்டையர்
    மொபைல்</a>) மற்றும் இரண்டு காரணி அங்கீகாரத்தை செயல்படுத்த கீழே உள்ள புலத்தில் குறியீட்டை உள்ளிடவும்.
  twofa_activated: இரட்டை காரணி அங்கீகாரம் வெற்றிகரமாக அமல்படுத்தப்பட்டது. உங்கள் கணக்கிற்கான <a data-method="post"
